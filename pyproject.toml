# Tooling configuration only.
#
# This project is deliberately NOT a distributable Python package: Hermes
# installs a plugin by cloning the repository straight into
# ``~/.hermes/plugins/<name>/`` and importing the directory, so the repository
# root *is* the plugin package. There is nothing to build or publish.
#
# Note for anyone running pytest by hand: because the repository root carries
# the plugin's ``__init__.py``, pytest must not treat it as a test package.
# Run the suite from the ``tests/`` directory (``cd tests && pytest``) or use
# ``./run-tests.sh``, which does that for you.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    # Deferred imports are load-bearing here: this plugin must not pull the
    # Discord adapter (or discord.py) into every `hermes` invocation.
    "E402",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
