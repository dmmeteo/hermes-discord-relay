# Hermes plugin manifest.
#
# ``name`` is load-bearing twice over: `hermes plugins install` uses it as the
# directory name under ~/.hermes/plugins/, and `hermes plugins enable` matches
# on it.  Keep it identical to the repository name.
manifest_version: 1
name: hermes-discord-relay
kind: platform
version: 1.1.0
description: >
  Opt-in conversation ownership by one Hermes bot, plus requests from explicitly
  trusted bots to allowed existing Discord threads. Preserves bot identity and
  native human authorization.
author: dmmeteo
requires_env:
  - name: DISCORD_BOT_TOKEN
    description: "Discord bot token (shared with the built-in Discord adapter)"
    prompt: "Discord bot token"
    url: "https://discord.com/developers/applications"
    password: true
