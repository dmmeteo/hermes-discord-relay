# Hermes plugin manifest.
#
# ``name`` is load-bearing twice over: `hermes plugins install` uses it as the
# directory name under ~/.hermes/plugins/, and `hermes plugins enable` matches
# on it.  Keep it identical to the repository name.
manifest_version: 1
name: hermes-discord-thread-ownership
kind: platform
version: 1.1.0
description: >
  Discord Relay adds opt-in trusted bot requests to existing guild threads and
  compatible single-owner thread admission. Uses the native Discord adapter,
  preserves bot provenance and downstream authorization, and registers under
  the existing discord platform ID. Install identity remains unchanged.
author: dmmeteo
requires_env:
  - name: DISCORD_BOT_TOKEN
    description: "Discord bot token (shared with the built-in Discord adapter)"
    prompt: "Discord bot token"
    url: "https://discord.com/developers/applications"
    password: true
